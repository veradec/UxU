    <h2>Welcome to UxU</h2>
    
    <p>Yes! UxU is a File Hosting service, but not in it's traditional sense. There is no Upload Button.
    You need to move to the cultured way of doing it -- using curl.</p>
    <br><br>
    <code>curl -X POST -F "file=@file.png"</code>
    <br><br>and the reponse will be a link with your Filename (sanitized ofcourse)
